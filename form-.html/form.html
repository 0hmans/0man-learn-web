<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Form HTML</title>
</head>
<body>
    <form >
        <label for="nama">Nama</label>
        <input type="text" name="baris 1" id="nama" placeholder="masukkan nama">
        <br>
        <label for="password">password</label>
        <input type="password" name="password" id="password"><br>
        <button type="submit">kirim</button>
        <br>
        <label for="email">email</label>
        <input type="email" name="email" id="email" placeholder="masukkan email">
        <label for="number">angka</label>
        <input type="number" name="number" id="number" min="0" max="80">
        <br>
        <label for="date">Tanggal</label>
        <input type="date" name="date" id="date">
        <br>
        <label for="color">warna</label>
        <input type="color" name="warna" id="color">
    </form>
</body>
</html>

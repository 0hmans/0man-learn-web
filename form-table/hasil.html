<!-- @format -->

<!Doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh Form HTML</title>
  </head>
  <body>
    <form>
      <table>
        <tr>
          <td align="right" align="right"><label type="nama">Nama:</label></td>
          <td>
            <input
              type="text"
              name="baris 1"
              id="nama"
              placeholder="masukkan nama" />
          </td align="right">
        </tr>
        <tr>
          <td align="right"><label type="password">password:</label></td>
          <td ><input type="password" name="password" id="password" /><br /></td>
        </tr>
        <tr>
          <td align="right"><label type="email">email:</label></td>
          <td >
            <input
              type="email"
              name="email"
              id="email"
              placeholder="masukkan email" />
          </td>
        </tr>
        <tr>
          <td align="right"><label type="number">angka:</label></td>
          <td>
            <input type="number" name="number" id="number" min="0" max="80" />
          </td>
        </tr>
        <tr>
          <td align="right"><label type="date">Tanggal:</label></td>
          <td><input type="date" name="date" id="date" /></td>
        </tr>
        <tr>
          <td align="right"><label type="color">warna:</label></td>
          <td><input type="color" name="warna" id="color" /></td>
        </tr>
        <tr>
          <td  align="right"colspan="2" align="right"><button type="submit">kirim!</button></td>
          <td></td>
        </tr>
      </table>
    </form>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=Input Atribut dan checkbox & Radio ">
    <title>Contoh </title>
</head>
<body>
    <h1>contoh ATRIBUT</h1>
    <form>
        <label for="nama">nama</label>
        <input type="text" nama="nama" id="nama" placeholder="masukkan nama" autocomplete="off" autofocus required >
        <br>
        <button type="submit">kirim</button>
        <br>
        <h2>Hobby</h2>
        <label for="hobi1"></label>
        <input type="checkbox" name="hobi1" id="hobi1" value="olahraga 1">olahraga
        <br>
        <label for="hobi2"></label>
        <input type="checkbox" name="hobi2" id="hobi2" value="ngoding">ngoding
        <br>
        <label for="hob3"></label>
        <input type="checkbox" name="hobi3" id="hobi3" value="memancing">memancing
        <br>
        <h2>jenis kelamin</h2>
        <label for="pria"></label>
        <input type="radio" name="jenis" id="pria " value="pria" checked>pria
        <br>
        <label for="wanita"></label>
        <input type="radio" name="jenis" id="wanita" value="wanita">wanita
        
    </form>
</body>
</html>
